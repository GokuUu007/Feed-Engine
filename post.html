<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedEngine – Post</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&family=Outfit:wght@600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar pokemon-navbar border-bottom" aria-label="Site">
    <div class="container">
      <a class="navbar-brand pokemon-brand" href="feed.html">
        <span class="pokemon-ball" aria-hidden="true"></span>
        <span class="pokemon-brand-name">Feed<span class="pokemon-brand-accent">Engine</span></span>
      </a>
      <div class="navbar-actions">
        <a class="nav-link" href="feed.html">Feed</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">
          <span class="theme-icon" aria-hidden="true">☀️</span>
          <span class="theme-label">Light mode</span>
        </button>
        <button id="logout-btn" class="btn btn-sm btn-outline-danger" type="button">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4 feed-layout app-main">
    <h1 class="h3">Post</h1>
    <div id="post-detail" class="post-detail" aria-live="polite"></div>
    <section class="comments-section" aria-labelledby="comments-heading">
      <h2 id="comments-heading" class="h4">Comments</h2>
      <ul id="comments-list" class="comments-list"></ul>
      <form id="comment-form" class="comment-form">
        <label class="visually-hidden" for="comment-text">Write a comment</label>
        <textarea id="comment-text" class="form-control" rows="2" maxlength="280"
          placeholder="Write a comment. Mention a trainer with @Name."></textarea>
        <button class="btn btn-accent" type="submit">Comment</button>
      </form>
      <p id="comment-status" class="visually-hidden" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/notify.js"></script>
  <script type="module" src="js/post.js"></script>
</body>
</html>
