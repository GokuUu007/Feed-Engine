<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedEngine – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&family=Outfit:wght@600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container py-5 login-layout">
    <header class="mb-5 text-center login-header">
      <button id="theme-toggle" class="theme-toggle login-theme-toggle" type="button" aria-label="Switch to light mode">
        <span class="theme-icon" aria-hidden="true">☀️</span>
        <span class="theme-label">Light mode</span>
      </button>
      <h1 class="pokemon-brand mb-1">
        <span class="pokemon-ball" aria-hidden="true"></span>
        <span class="pokemon-brand-name">Feed<span class="pokemon-brand-accent">Engine</span></span>
      </h1>
      <p class="text-secondary mb-0">Choose your trainer to jump into the feed.</p>
    </header>

    <section aria-label="Choose a demo user">
      <div id="user-list"></div>
    </section>
    <footer class="text-center mt-4">
      <button id="reset-btn" class="btn btn-sm btn-outline-secondary" type="button">Reset demo data</button>
    </footer>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
