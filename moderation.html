<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedEngine – Moderation</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&family=Outfit:wght@600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar pokemon-navbar border-bottom" aria-label="Site">
    <div class="container">
      <a class="navbar-brand pokemon-brand" href="feed.html">
        <span class="pokemon-ball" aria-hidden="true"></span>
        <span class="pokemon-brand-name">Feed<span class="pokemon-brand-accent">Engine</span></span>
      </a>
      <div class="navbar-actions">
        <a class="nav-link" href="feed.html">Feed</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">
          <span class="theme-icon" aria-hidden="true">☀️</span>
          <span class="theme-label">Light mode</span>
        </button>
        <button id="logout-btn" class="btn btn-sm btn-outline-danger" type="button">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4 social-layout app-main">
    <header class="moderation-header">
      <h1 class="h3">Moderation</h1>
      <p class="text-secondary">Hide posts temporarily or delete any post with a required reason. Hidden posts can be restored.</p>
    </header>
    <form id="moderation-reason-form" class="moderation-reason-form" hidden>
      <label id="moderation-reason-label" for="moderation-reason">Reason for hiding this post</label>
      <textarea id="moderation-reason" class="form-control" rows="2" maxlength="280" required></textarea>
      <div class="moderation-form-actions">
        <button id="moderation-submit" class="btn btn-accent" type="submit">Hide post</button>
        <button id="cancel-hide" class="btn btn-outline-secondary" type="button">Cancel</button>
      </div>
    </form>
    <p id="moderation-status" class="visually-hidden" aria-live="polite"></p>
    <ul id="moderation-list" class="post-list" aria-label="Posts for moderation" aria-live="polite"></ul>
  </main>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/notify.js"></script>
  <script type="module" src="js/moderation.js"></script>
</body>
</html>
