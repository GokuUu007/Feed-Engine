<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedEngine – Feed</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&family=Outfit:wght@600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar pokemon-navbar border-bottom" aria-label="Site">
    <div class="container">
      <a class="navbar-brand pokemon-brand" href="feed.html">
        <span class="pokemon-ball" aria-hidden="true"></span>
        <span class="pokemon-brand-name">Feed<span class="pokemon-brand-accent">Engine</span></span>
      </a>
      <div class="navbar-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">
          <span class="theme-icon" aria-hidden="true">☀️</span>
          <span class="theme-label">Light mode</span>
        </button>
        <button id="logout-btn" class="btn btn-sm btn-outline-danger" type="button">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4 feed-layout app-main">
    <div class="feed-heading">
      <h1 id="greeting" class="mb-3"></h1>
      <div class="feed-heading-actions">
        <a id="my-profile-link" class="profile-link" href="profile.html">My profile</a>
        <label class="following-filter">
          <input id="following-only" type="checkbox">
          <span>Following only</span>
        </label>
      </div>
    </div>

    <section class="composer" aria-label="Write a post">
      <label class="visually-hidden" for="composer-text">Write a post</label>
      <textarea id="composer-text" class="form-control" rows="3"
        placeholder="What's happening? Use @Name to mention a trainer." maxlength="280"></textarea>
      <div class="composer-footer">
        <span id="char-counter" class="counter">0 / 280</span>
        <button id="post-btn" class="btn btn-accent" type="button" disabled>Post</button>
      </div>
      <p id="post-status" class="visually-hidden" aria-live="polite"></p>
    </section>

    <section class="simulator-panel" aria-label="Activity simulator">
      <div>
        <strong>Activity simulator</strong>
        <p id="simulator-status" class="mb-0 text-secondary">Paused. Start to simulate community activity.</p>
      </div>
      <button id="simulator-toggle" class="btn btn-sm btn-outline-secondary" type="button">Start simulator</button>
    </section>

    <ul id="post-list" class="post-list" role="feed" aria-label="Activity feed" aria-live="polite"></ul>
    <div id="feed-sentinel" aria-hidden="true"></div>
    <button id="load-more-btn" class="btn btn-outline-secondary load-more" type="button" hidden>Load more</button>
  </main>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/notify.js"></script>
  <script type="module" src="js/feed.js"></script>
</body>
</html>
