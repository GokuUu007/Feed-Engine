<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedEngine – Feed</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&family=Outfit:wght@600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
 <main class="container py-4 feed-layout">
</head>
<body>
  <nav class="navbar bg-body-tertiary border-bottom">
    <div class="container">
      <span class="navbar-brand">FeedEngine</span>
      <button id="logout-btn" class="btn btn-sm btn-outline-danger">Logout</button>
    </div>
  </nav>

 <main class="container py-4 feed-layout">
  <h2 id="greeting" class="mb-3"></h2>

  <section class="composer" aria-label="Write a post">
    <textarea id="composer-text" class="form-control" rows="3"
      placeholder="What's happening in your club?" maxlength="280"></textarea>
    <div class="composer-footer">
      <span id="char-counter" class="counter">0 / 280</span>
      <button id="post-btn" class="btn btn-accent" disabled>Post</button>
    </div>
  </section>

  <ul id="post-list" class="post-list" role="feed" aria-label="Activity feed"></ul>
</main>
  <script type="module" src="js/feed.js"></script>
</body>
</html>
