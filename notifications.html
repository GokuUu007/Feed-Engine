<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeedEngine – Notifications</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600&family=Outfit:wght@600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar pokemon-navbar border-bottom" aria-label="Site">
    <div class="container">
      <a class="navbar-brand pokemon-brand" href="feed.html">
        <span class="pokemon-ball" aria-hidden="true"></span>
        <span class="pokemon-brand-name">Feed<span class="pokemon-brand-accent">Engine</span></span>
      </a>
      <div class="navbar-actions">
        <a class="nav-link" href="feed.html">Feed</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">
          <span class="theme-icon" aria-hidden="true">☀️</span>
          <span class="theme-label">Light mode</span>
        </button>
        <button id="logout-btn" class="btn btn-sm btn-outline-danger" type="button">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4 social-layout app-main">
    <section class="notification-panel" aria-labelledby="notifications-heading">
      <div class="notification-heading">
        <h1 id="notifications-heading" class="h3">Notifications</h1>
        <button id="mark-all-read" class="btn btn-sm btn-outline-secondary" type="button">Mark all as read</button>
      </div>
      <div class="notification-tabs" role="tablist" aria-label="Filter notifications">
        <button id="all-tab" class="notification-tab" type="button" role="tab" aria-controls="notification-list" aria-selected="true" tabindex="0">All</button>
        <button id="unread-tab" class="notification-tab" type="button" role="tab" aria-controls="notification-list" aria-selected="false" tabindex="-1">Unread</button>
      </div>
      <ul id="notification-list" class="notification-list" role="tabpanel" aria-labelledby="all-tab" aria-live="polite"></ul>
    </section>
  </main>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/notify.js"></script>
  <script type="module" src="js/notifications.js"></script>
</body>
</html>
